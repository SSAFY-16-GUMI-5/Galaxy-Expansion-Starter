name: Validate Rust Runner

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            fixture: tests/rust/target/debug/galaxy-rust-fixture
          - os: windows-latest
            fixture: tests/rust/target/debug/galaxy-rust-fixture.exe
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: rustup toolchain install stable --profile minimal
      - run: cargo test --locked --manifest-path framework/adapters/rust/Cargo.toml
      - run: cargo test --locked --manifest-path tests/rust/Cargo.toml
      - run: cargo build --locked --manifest-path solution/rust/Cargo.toml
      - run: cargo build --locked --manifest-path tests/rust/Cargo.toml
      - run: node scripts/verify-protocol.mjs -- ${{ matrix.fixture }}
      - run: node scripts/verify-protocol.mjs -- ${{ matrix.fixture }} --reset-on-start
